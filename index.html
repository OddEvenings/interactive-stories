<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Time</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef4fa;font-family:Poppins,Arial,sans-serif;color:#1c2733;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.box{max-width:720px;width:100%;text-align:center}
h1{font-family:Fredoka,sans-serif;color:#16406b;font-size:38px;margin:0 0 6px}
p{margin:0 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
a{display:block;background:#fff;border-radius:18px;padding:26px 18px;text-decoration:none;color:#16406b;box-shadow:0 6px 0 #dce8f4,0 10px 30px rgba(0,0,0,.08)}
a b{display:block;font-family:Fredoka,sans-serif;font-size:30px}
a span{font-size:15px;color:#444}
a:hover{outline:3px solid #3d8fc6}
</style></head><body><div class="box">
<h1>Story Time</h1><p>Pick this week's stories.</p>
<div class="grid" style="grid-template-columns:1fr">
<a href="week14/"><b>Week 14</b><span>Grade 3: The Backdrop That Would Not Budge &nbsp;•&nbsp; Grade 4: The Odyssey Exhibit</span></a>
</div></div></body></html>
