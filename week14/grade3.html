<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--main:#16406b;--accent:#3d8fc6;--soft:#eef4fa;--card:#fff;--vocab:#c2412d;--ink:#1c2733;--tint:#dce8f4;--ok:#1f7a3a;--warn:#b5651d}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--soft);color:var(--ink);font-family:Poppins,Arial,sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--main);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px}
.top h1{font-family:Fredoka,Poppins,sans-serif;font-size:20px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:13px;opacity:.9}
.bar{height:6px;background:rgba(255,255,255,.25)}
.bar>div{height:100%;background:var(--accent);transition:width .4s}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 110px}
.book{perspective:1600px}
.page{background:var(--card);border-radius:18px;box-shadow:0 6px 0 var(--tint),0 10px 30px rgba(0,0,0,.08);padding:22px;transform-origin:left center}
.flip-next{animation:flipNext .45s ease}
.flip-prev{animation:flipPrev .45s ease}
@keyframes flipNext{from{transform:rotateY(-70deg);opacity:.2}to{transform:rotateY(0);opacity:1}}
@keyframes flipPrev{from{transform:rotateY(70deg);opacity:.2}to{transform:rotateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.flip-next,.flip-prev{animation:none}}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.chip{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.pnum{font-family:Fredoka,sans-serif;color:var(--main);font-weight:600;font-size:15px;margin-left:8px}
.art{border-radius:14px;overflow:hidden;border:3px solid var(--main);margin:12px 0 14px;line-height:0}
.art{background:var(--tint)}.art svg{width:100%;height:auto;max-height:38vh;display:block}
.story p{margin:0 0 .85em}
.g3 .story{font-size:21px;line-height:1.65}
.g4 .story{font-size:18px;line-height:1.65}
.vw{color:var(--vocab);font-weight:700;background:none;border:none;padding:0;font-size:inherit;border-bottom:2px dotted var(--vocab)}
.tip{position:fixed;z-index:20;max-width:300px;background:#fff;border:2px solid var(--vocab);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.tip b{color:var(--vocab)}
.listen{background:var(--tint);border:none;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--main);margin-left:8px}
.qpanel{background:var(--soft);border:2px dashed var(--accent);border-radius:16px;padding:16px 18px}
.qpanel h2{font-family:Fredoka,sans-serif;font-size:19px;color:var(--main);margin:0 0 8px}
.q{margin:14px 0 18px}
.q .qt{font-weight:600;margin-bottom:8px}
.g3 .q .qt{font-size:18px}.g4 .q .qt{font-size:16.5px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:2px solid var(--tint);border-radius:12px;padding:11px 14px;margin:7px 0;font-size:16px;color:var(--ink);min-height:48px}
.g3 .opt{font-size:17px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--main);font-weight:700;display:grid;place-items:center}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--main);background:var(--tint)}
.opt.sel .l{background:var(--main);color:#fff}
textarea{width:100%;min-height:110px;border:2px solid var(--tint);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--ink);resize:vertical;background:#fff}
textarea:focus,input:focus{outline:3px solid var(--accent);outline-offset:1px}
.count{font-size:12px;color:#777;text-align:right}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--tint);display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;z-index:6}
.btn{border:none;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:600;min-height:50px}
.btn.primary{background:var(--main);color:#fff}
.btn.ghost{background:var(--tint);color:var(--main)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav[hidden]{display:none}
.need{font-size:14px;color:var(--warn);text-align:center;flex:1}
.start{max-width:640px;margin:0 auto;text-align:center}
.start h2{font-family:Fredoka,sans-serif;font-size:34px;color:var(--main);margin:8px 0 2px}
.start .sub{color:var(--accent);font-weight:600;margin-bottom:14px}
.field{text-align:left;margin:14px 0}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;font-size:18px;padding:12px;border:2px solid var(--tint);border-radius:12px;font-family:inherit}
.how{text-align:left;background:var(--soft);border-radius:14px;padding:12px 16px;font-size:15px;margin:14px 0}
.how li{margin:4px 0}
.review li{margin:6px 0}
.done{text-align:center;max-width:620px;margin:0 auto}
.done h2{font-family:Fredoka,sans-serif;color:var(--main);font-size:32px;margin:8px 0}
.score{font-family:Fredoka,sans-serif;font-size:54px;color:var(--ok);margin:6px 0}
.err{color:#b00020;font-weight:600}
.small{font-size:13px;color:#666}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots span{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots span.on{background:#fff}
.dots span.doneq{background:var(--accent)}
.teach{margin-top:26px;border-top:2px dashed var(--tint);padding-top:12px}
.tlink{background:none;border:none;color:#8a96a3;font-size:13px;text-decoration:underline}
.tbox{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px;flex-wrap:wrap}
.tbox input{font-size:20px;width:120px;padding:8px;border:2px solid var(--tint);border-radius:10px;text-align:center;letter-spacing:.2em;font-family:inherit}
.report{text-align:left;max-width:900px;margin:0 auto}
.report h2{font-family:Fredoka,sans-serif;color:var(--main);margin:4px 0}
.sum{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.sum div{background:var(--soft);border-radius:12px;padding:10px 14px;flex:1;min-width:130px}
.sum b{display:block;font-family:Fredoka,sans-serif;font-size:28px;color:var(--main)}
.ri{border:2px solid var(--tint);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.ri.right{border-color:#9fd3ad;background:#f1faf3}.ri.wrong{border-color:#efb1a8;background:#fdf3f1}
.ri .lab{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase}
.ri .ans{margin-top:4px}.ri .key{margin-top:4px;color:#555;font-size:14px}
.ri .mark{font-weight:700}.ri.right .mark{color:var(--ok)}.ri.wrong .mark{color:#b00020}
@media print{.nav,.top,.noprint{display:none!important}.page{box-shadow:none}}
</style>
</head>
<body>
<div class="top"><h1 id="ttl"></h1><div class="dots" id="dots"></div><div class="who" id="who"></div></div>
<div class="bar"><div id="prog" style="width:0"></div></div>
<main class="wrap" id="app"></main>
<nav class="nav" id="nav" hidden>
  <button class="btn ghost" id="back">&#8592; Back</button>
  <div class="need" id="need"></div>
  <button class="btn primary" id="next">Next page &#8594;</button>
</nav>
<script>
/* Standalone story reader: no sign-in and no internet connection to any server.
   Answers stay on the student's device. After "Turn In" the student cannot change anything
   and does not see a score. The teacher types the teacher code on the finished screen to see
   the score and every answer. The answer key is locked with the teacher code. */
var BOOK = {"grade": 3, "title": "The Backdrop That Would Not Budge", "subtitle": "A Realistic Fiction Story", "theme": {"main": "#7a3b12", "accent": "#d98a1c", "soft": "#fbf6ec", "card": "#ffffff", "vocab": "#b03a2e", "ink": "#2d2419", "tint": "#f3e6cc"}, "pages": [{"skill": "Characters and Setting", "text": "Room 12 was getting ready for a big performance. The class would act out a play about a stately castle for the whole school.\n\nMs. Carter gave everyone a job. Lina and Sami would paint the backdrop. Ben would be the narrator and tell the story.\n\n\"Our backdrop must look like a real castle,\" Lina said. \"It has to be superior to every backdrop this school has ever seen!\"", "art": "<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\"><rect width=\"400\" height=\"220\" fill=\"#f6ead2\"/><rect width=\"400\" height=\"220\" fill=\"#f6ead2\"/><rect y=\"170\" width=\"400\" height=\"50\" fill=\"#c9a26b\"/><rect x=\"30\" y=\"30\" width=\"170\" height=\"100\" fill=\"#2f5d50\" stroke=\"#8a5a36\" stroke-width=\"6\"/><text x=\"115\" y=\"70\" font-size=\"13\" fill=\"#ffffff\" text-anchor=\"middle\" font-family=\"Poppins, Arial\">OUR PLAY</text><text x=\"115\" y=\"92\" font-size=\"11\" fill=\"#ffd25a\" text-anchor=\"middle\" font-family=\"Poppins, Arial\">The Stately Castle</text><text x=\"115\" y=\"112\" font-size=\"10\" fill=\"#ffffff\" text-anchor=\"middle\" font-family=\"Poppins, Arial\">Friday at 1:00</text><rect x=\"250.0\" y=\"70.0\" width=\"105.0\" height=\"52.5\" fill=\"#cfc3ad\"/><rect x=\"242.5\" y=\"47.5\" width=\"25.5\" height=\"75.0\" fill=\"#a89a80\"/><rect x=\"337.0\" y=\"47.5\" width=\"25.5\" height=\"75.0\" fill=\"#a89a80\"/><rect x=\"242.5\" y=\"41.5\" width=\"4.5\" height=\"7.5\" fill=\"#a89a80\"/><rect x=\"337.0\" y=\"41.5\" width=\"4.5\" height=\"7.5\" fill=\"#a89a80\"/><rect x=\"249.2\" y=\"41.5\" width=\"4.5\" height=\"7.5\" fill=\"#a89a80\"/><rect x=\"343.8\" y=\"41.5\" width=\"4.5\" height=\"7.5\" fill=\"#a89a80\"/><rect x=\"256.0\" y=\"41.5\" width=\"4.5\" height=\"7.5\" fill=\"#a89a80\"/><rect x=\"350.5\" y=\"41.5\" width=\"4.5\" height=\"7.5\" fill=\"#a89a80\"/><rect x=\"262.8\" y=\"41.5\" width=\"4.5\" height=\"7.5\" fill=\"#a89a80\"/><rect x=\"357.2\" y=\"41.5\" width=\"4.5\" height=\"7.5\" fill=\"#a89a80\"/><rect x=\"253.0\" y=\"64.0\" width=\"7.5\" height=\"7.5\" fill=\"#cfc3ad\"/><rect x=\"268.0\" y=\"64.0\" width=\"7.5\" height=\"7.5\" fill=\"#cfc3ad\"/><rect x=\"283.0\" y=\"64.0\" width=\"7.5\" height=\"7.5\" fill=\"#cfc3ad\"/><rect x=\"298.0\" y=\"64.0\" width=\"7.5\" height=\"7.5\" fill=\"#cfc3ad\"/><rect x=\"313.0\" y=\"64.0\" width=\"7.5\" height=\"7.5\" fill=\"#cfc3ad\"/><rect x=\"328.0\" y=\"64.0\" width=\"7.5\" height=\"7.5\" fill=\"#cfc3ad\"/><rect x=\"343.0\" y=\"64.0\" width=\"7.5\" height=\"7.5\" fill=\"#cfc3ad\"/><path d=\"M289.0 122.5 q13.5 -22.5 27.0 0 v0.0 h-27.0 z\" fill=\"#6b4423\"/><rect x=\"250.0\" y=\"82.0\" width=\"10.5\" height=\"13.5\" fill=\"#7aa6c9\"/><rect x=\"344.5\" y=\"82.0\" width=\"10.5\" height=\"13.5\" fill=\"#7aa6c9\"/><rect x=\"248.5\" y=\"59.5\" width=\"7.5\" height=\"10.5\" fill=\"#7aa6c9\"/><rect x=\"230\" y=\"150\" width=\"150\" height=\"10\" fill=\"#8a5a36\"/><rect x=\"240\" y=\"160\" width=\"8\" height=\"30\" fill=\"#6b4423\"/><rect x=\"362\" y=\"160\" width=\"8\" height=\"30\" fill=\"#6b4423\"/><rect x=\"60\" y=\"150\" width=\"40\" height=\"30\" fill=\"#e7553c\"/><rect x=\"110\" y=\"155\" width=\"40\" height=\"25\" fill=\"#3d8fc6\"/></svg>", "qs": [{"id": "p1a", "type": "mc", "q": "What is Room 12 getting ready for?", "options": ["A performance of a play", "A science fair", "A field trip", "A bake sale"]}, {"id": "p1b", "type": "fr", "q": "What job do Lina and Sami have? What does Lina want it to look like?"}]}, {"skill": "Vocabulary", "text": "Lina and Sami painted for a whole week. They painted tall towers, wide windows, and a long stone bridge. They made the hills in the back very small, so the castle looked far away and deep.\n\n\"This can deceive people's eyes,\" said Sami. \"They will think it is real!\"\n\nWhen they were done, the backdrop was huge. It was as wide as the whole classroom wall.", "art": "<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\"><rect width=\"400\" height=\"220\" fill=\"#efe3c8\"/><rect width=\"400\" height=\"220\" fill=\"#efe3c8\"/><rect y=\"190\" width=\"400\" height=\"30\" fill=\"#c9a26b\"/><rect x=\"40.0\" y=\"30.0\" width=\"320.0\" height=\"150.0\" fill=\"#9fd0ee\"/><path d=\"M40.0 147.0 q80.0 -27.0 160.0 0 q80.0 -21.0 160.0 0 v33.0 h-320.0 z\" fill=\"#8cc06a\"/><rect x=\"110.4\" y=\"107.7\" width=\"177.3\" height=\"88.7\" fill=\"#cfc3ad\"/><rect x=\"97.7\" y=\"69.7\" width=\"43.1\" height=\"126.7\" fill=\"#a89a80\"/><rect x=\"257.3\" y=\"69.7\" width=\"43.1\" height=\"126.7\" fill=\"#a89a80\"/><rect x=\"97.7\" y=\"59.5\" width=\"7.6\" height=\"12.7\" fill=\"#a89a80\"/><rect x=\"257.3\" y=\"59.5\" width=\"7.6\" height=\"12.7\" fill=\"#a89a80\"/><rect x=\"109.1\" y=\"59.5\" width=\"7.6\" height=\"12.7\" fill=\"#a89a80\"/><rect x=\"268.7\" y=\"59.5\" width=\"7.6\" height=\"12.7\" fill=\"#a89a80\"/><rect x=\"120.5\" y=\"59.5\" width=\"7.6\" height=\"12.7\" fill=\"#a89a80\"/><rect x=\"280.1\" y=\"59.5\" width=\"7.6\" height=\"12.7\" fill=\"#a89a80\"/><rect x=\"131.9\" y=\"59.5\" width=\"7.6\" height=\"12.7\" fill=\"#a89a80\"/><rect x=\"291.5\" y=\"59.5\" width=\"7.6\" height=\"12.7\" fill=\"#a89a80\"/><rect x=\"115.5\" y=\"97.5\" width=\"12.7\" height=\"12.7\" fill=\"#cfc3ad\"/><rect x=\"140.8\" y=\"97.5\" width=\"12.7\" height=\"12.7\" fill=\"#cfc3ad\"/><rect x=\"166.1\" y=\"97.5\" width=\"12.7\" height=\"12.7\" fill=\"#cfc3ad\"/><rect x=\"191.5\" y=\"97.5\" width=\"12.7\" height=\"12.7\" fill=\"#cfc3ad\"/><rect x=\"216.8\" y=\"97.5\" width=\"12.7\" height=\"12.7\" fill=\"#cfc3ad\"/><rect x=\"242.1\" y=\"97.5\" width=\"12.7\" height=\"12.7\" fill=\"#cfc3ad\"/><rect x=\"267.5\" y=\"97.5\" width=\"12.7\" height=\"12.7\" fill=\"#cfc3ad\"/><path d=\"M176.3 196.3 q22.8 -38.0 45.6 0 v0.0 h-45.6 z\" fill=\"#6b4423\"/><rect x=\"110.4\" y=\"127.9\" width=\"17.7\" height=\"22.8\" fill=\"#7aa6c9\"/><rect x=\"270.0\" y=\"127.9\" width=\"17.7\" height=\"22.8\" fill=\"#7aa6c9\"/><rect x=\"107.9\" y=\"89.9\" width=\"12.7\" height=\"17.7\" fill=\"#7aa6c9\"/><rect x=\"40.0\" y=\"30.0\" width=\"320.0\" height=\"150.0\" fill=\"none\" stroke=\"#8a5a36\" stroke-width=\"6\"/><rect x=\"300\" y=\"175\" width=\"40\" height=\"22\" rx=\"4\" fill=\"#3d8fc6\"/><rect x=\"350\" y=\"178\" width=\"30\" height=\"18\" rx=\"4\" fill=\"#e7553c\"/><line x1=\"70\" y1=\"196\" x2=\"110\" y2=\"160\" stroke=\"#7a5236\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"111\" cy=\"158\" r=\"5\" fill=\"#f2b134\"/></svg>", "qs": [{"id": "p2a", "type": "mc", "q": "Why did Lina and Sami paint the hills very small?", "options": ["Hills are always small", "They ran out of paint", "To make the castle look deep and real", "Ms. Carter told them to"]}, {"id": "p2b", "type": "fr", "q": "Sami says the backdrop can deceive people's eyes. What does he mean?"}]}, {"skill": "Story Problem", "text": "On the day before the show, the class carried the backdrop to the stage. It was so heavy that four kids had to lift it.\n\nThey tried to hang it on the back wall, but it kept sliding down.\n\n\"It will not stay up!\" cried Ben. \"The performance is tomorrow!\"\n\nLina felt like crying. All of their hard work might go to waste.", "art": "<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\"><rect width=\"400\" height=\"220\" fill=\"#3a2a40\"/><rect y=\"170\" width=\"400\" height=\"50\" fill=\"#b77b48\"/><line x1=\"0\" y1=\"175\" x2=\"400\" y2=\"175\" stroke=\"#9c6538\"/><line x1=\"0\" y1=\"185\" x2=\"400\" y2=\"185\" stroke=\"#9c6538\"/><line x1=\"0\" y1=\"195\" x2=\"400\" y2=\"195\" stroke=\"#9c6538\"/><line x1=\"0\" y1=\"205\" x2=\"400\" y2=\"205\" stroke=\"#9c 124.8\" width=\"13.3\" height=\"17.1\" fill=\"#7aa6c9\"/><rect x=\"252.5\" y=\"124.8\" width=\"13.3\" height=\"17.1\" fill=\"#7aa6c9\"/><rect x=\"130.9\" y=\"96.3\" width=\"9.5\" height=\"13.3\" fill=\"#7aa6c9\"/><rect x=\"80.0\" y=\"50.0\" width=\"240.0\" height=\"120.0\" fill=\"none\" stroke=\"#8a5a36\" stroke-width=\"6\"/></g><path d=\"M330 120 l20 20 M330 140 l20 -20\" stroke=\"#c0392b\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M60 70 v60 m-10 -12 l10 14 l10 -14\" stroke=\"#ffd25a\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "qs": [{"id": "p3a", "type": "mc", "q": "What problem does the class have?", "options": ["Ben forgot his lines", "The backdrop will not stay up", "The stage is locked", "The paint is still wet"]}, {"id": "p3b", "type": "fr", "q": "How does Lina feel on this page? Why does she feel that way?"}]}, {"skill": "Cause and Effect", "text": "Sami looked up. Above the stage was a long metal bar with small wheels hanging from it.\n\n\"Ms. Carter, what are those?\" he asked.\n\n\"Those are pulleys,\" said Ms. Carter. \"Long ago, theaters used pulleys to lift heavy backdrops. A rope goes over each wheel. When you pull the rope down, the backdrop goes up.\"\n\nSami grinned. \"Then we can use them, too!\"", "art": "<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\"><rect width=\"400\" height=\"220\" fill=\"#2a2236\"/><rect y=\"170\" width=\"400\" height=\"50\" fill=\"#b77b48\"/><line x1=\"0\" y1=\"175\" x2=\"400\" y2=\"175\" stroke=\"#9c6538\"/><line x1=\"0\" y1=\"185\" x2=\"400\" y2=\"185\" stroke=\"#9c6538\"/><line x1=\"0\" y1=\"195\" x2=\"400\" y2=\"195\" stroke=\"#9c6538\"/><line x1=\"0\" y1=\"205\" x2=\"400\" y2=\"205\" stroke=\"#9c6538\"/><line x1=\"0\" y1=\"215\" x2=\"400\" y2=\"215\" stroke=\"#9c6538\"/><rect x=\"80\" y=\"26\" width=\"240\" height=\"8\" fill=\"#7a7a7a\"/><circle cx=\"120\" cy=\"42\" r=\"11\" fill=\"#7a5236\"/><circle cx=\"120\" cy=\"42\" r=\"6\ ill": "Theme", "text": "Ben could not sleep that night. He knew he had tried to deceive his friends.\n\nThe next morning, he walked up to Lina and Sami. \"I scratched the tower,\" he said. \"I'm sorry I said I didn't.\"\n\nLina was quiet for a moment. Then she smiled. \"Thank you for telling the truth. Everyone makes mistakes.\"\n\nHis friends were merciful. \"Let's fix it together,\" said Sami.", "art": "<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\"><rect width=\"400\" height=\"220\" fill=\"#fdf1d6\"/><rect width=\"400\" height=\"220\" fill=\"#fdf1d6\"/><circle cx=\"330\" cy=\"50\" r=\"26\" fill=\"#ffd25a\"/><rect y=\"170\" width=\"400\" height=\"50\" fill=\"#c9a26b\"/><rect x=\"40\" y=\"70\" width=\"140\" height=\"90\" rx=\"10\" fill=\"#ffffff\" stroke=\"#d98a1c\" stroke-width=\"4\"/><text x=\"110\" y=\"108\" font-size=\"15\" fill=\"#b03a2e\" text-anchor=\"middle\" font-family=\"Poppins, Arial\" font-weight=\"700\">I'm sorry.</text><text x=\"110\" y=\"132\" font-size=\"12\" fill=\"#7a3b12\" text-anchor=\"middle\" font-family=\"Poppins, Arial\">Let's fix it together.</text><rect x=\"230\" y=\"110\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#ffffff\" stroke=\"#8a5a36\" stroke-width=\"3\"/><rect x=\"240\" y=\"122\" width=\"18\" height=\"18\" rx=\"9\" fill=\"#e7553c\"/><rect x=\"264\" y=\"122\" width=\"18\" height=\"18\" rx=\"9\" fill=\"#3d8fc6\"/><rect x=\"288\" y=\"122\" width=\"18\" height=\"18\" rx=\"9\" fill=\"#f2b134\"/><rect x=\"312\" y=\"122\" width=\"18\" height=\"18\" rx=\"9\" fill=\"#3c9a4a\"/><line x1=\"250\" y1=\"160\" x2=\"320\" y2=\"100\" stroke=\"#7a5236\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>", "qs": [{"id": "p6a", "type": "mc", "q": "How were Lina and Sami merciful?", "options": ["They told Ms. Carter", "They made Ben fix it alone", "They stopped talking to Ben", "They forgave Ben and offered to help"]}, {"id": "p6b", "type": "fr", "q": "Why do you think Ben decided to tell the truth?"}]}, {"skill": "Retell", "text": "The three friends painted over the scratch together. That afternoon, the play began.\n\nBen and Sami pulled the ropes, and the stately castle rose up behind the actors. The audience gasped.\n\nAfter the play, the principal, an eminent visitor from the school board, and all the families clapped. \"That is the best backdrop I have ever seen!\" said the principal.\n\nLina looked at Ben and Sami. \"It was a team backdrop,\" she said.", "art": "<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\"><rect width=\"400\" height=\"220\" fill=\"#3a1f2e\"/><rect y=\"170\" width=\"400\" height=\"50\" fill=\"#b77b48\"/><line x1=\"0\" y1=\"175\" x2=\"400\" y2=\"175\" stroke=\"#9c6538\"/><line x1=\"0\" y1=\"185\" x2=\"400\" y2=\"185\" stroke=\"#9c6538\"/><line x1=\"0\" y1=\"195\" x2=\"400\" y2=\"195\" stroke=\"#9c6538\"/><line x1=\"0\" y1=\"205\" x2=\"400\" y2=\"205\" stroke=\"#9c6538\"/><line x1=\"0\" y1=\"215\" x2=\"400\" y2=\"215\" stroke=\"#9c6538\"/><rect width=\"40\" height=\"220\" fill=\"#8e1f4a\"/><rect x=\"360\" width=\"40\" height=\"220\" fill=\"#8e1f4a\"/><rect width=\"400\" height=\"22\" fill=\"#8e1f4a\"/><rect y=\"20\" width=\"400\" height=\"5\" fill=\"#d9a62e\"/><rect x=\"40\" y=\"25\" width=\"320\" height=\"145\" fill=\"#22303f\"/><rect x=\"60.0\" y=\"34.0\" width=\"280.0\" height=\"130.0\" fill=\"#9fd0ee\"/><path d=\"M60.0 135.4 q70.0 -23.4 140.0 0 q70.0 -18.2 140.0 0 v28.6 h-280.0 z\" fill=\"#8cc06a\"/><rect x=\"121.6\" y=\"101.7\" width=\"155.2\" height=\"77.6\" fill=\"#cfc3ad\"/><rect x=\"110.5\" y=\"68.5\" width=\"37.7\" height=\"110.8\" fill=\"#a89a80\"/><rect x=\"250.2\" y=\"68.5\" width=\"37.7\" height=\"110.8\" fill=\"#a89a80\"/><rect x=\"110.5\" y=\"59.6\" width=\"6.7\" height=\"11.1\" fill=\"#a89a80\"/><rect x=\"250.2\" y=\"59.6\" width=\"6.7\" height=\"11.1\" fill=\"#a89a80\"/><rect x=\"120.5\" y=\"59.6\" width=\"6.7\" height=\"11.1\" fill=\"#a89a80\"/><rect x=\"260.1\" y= function fnv(str){ var b = unescape(encodeURIComponent(str)), h = 0x811c9dc5; for (var i = 0; i < b.length; i++) { h ^= b.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }

    for (var i = 0; i < raw.length; i++) out += String.fromCharCode(raw.charCodeAt(i) ^ next());
    var k = JSON.parse(decodeURIComponent(escape(out)));

  } catch(e){ return null; }
}

function markVocab(text){
  var h = esc(text);
  Object.keys(BOOK.vocab).forEach(function(w){
    var re = new RegExp('\\b(' + w + '(?:s|ed)?)\\b', 'gi');
    h = h.replace(re, '<button type="button" class="vw" data-w="' + w + '">$1</button>');
  });
  return h.split('\n\n').map(function(p){ return '<p>' + p + '</p>'; }).join('');
}

function qHTML(q, n){
  var a = state.answers[q.id], h = '<div class="q" data-id="' + q.id + '"><div class="qt">' + n + '. ' + esc(q.q) + '</div>';
  if (q.type === 'mc') {
    q.options.forEach(function(o, i){
      h += '<button type="button" class="opt' + (a === i ? ' sel' : '') + '" data-q="' + q.id + '" data-i="' + i + '"><span class="l">' + 'ABCD'[i] + '</span><span>' + esc(o) + '</span></button>';
    });
  } else {
    h += '<textarea data-q="' + q.id + '" placeholder="Type your answer in complete sentences...">' + esc(a || '') + '</textarea>' +
         '<div class="count" data-c="' + q.id + '"></div>';
  }
  return h + '</div>';
}

function answered(q){
  var a = state.answers[q.id];
  return q.type === 'mc' ? typeof a === 'number' : words(a) >= MIN_WORDS;
}
function qsFor(step){ return step >= 1 && step <= N ? BOOK.pages[step - 1].qs : step === N + 1 ? BOOK.final : []; }

  BOOK.final.forEach(function(q, k){ out.push({q: q, label: 'Reread and Respond, question ' + (k + 1)}); });
  return out;
}

    (state.name ? '<p>Welcome back, <b>' + esc(state.name) + '</b>!</p>' :
    '<div class="field"><label for="nm">Your first and last name</label><input id="nm" autocomplete="off" maxlength="60"></div>' +

function bindStart(){

  go.onclick = function(){
    if (!state.name) {
      var nm = document.getElementById('nm').value.trim().replace(/\s+/g, ' ');
      if (nm.split(' ').length < 2 || nm.length < 4) { err.textContent = 'Please type your first and last name.'; return; }
      state.name = nm; state.klass = document.getElementById('kl').value.trim();
    }
    state.started = state.started || new Date().toISOString();
    if (!state.step || state.step < 1) state.step = 1;

  };
}

function reviewHTML(){
  var missing = labels().filter(function(x){ return !answered(x.q); }).map(function(x){ return x.label; });
  var h = '<div class="start"><h2>Ready to turn in?</h2><p>Name: <b>' + esc(state.name) + '</b>' + (state.klass ? '  •  Class: <b>' + esc(state.klass) + '</b>' : '') + '</p>';
  if (missing.length) h += '<div class="how"><b>Finish these first:</b><ul class="review">' + missing.map(function(m){ return '<li>' + m + '</li>'; }).join('') + '</ul></div>';

}

function fmt(d){ try { return new Date(d).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}); } catch(e){ return ''; } }

function doneHTML(){
  return '<div class="done"><h2>Turned in! Great job, ' + esc(state.name.split(' ')[0]) + '!</h2>' +
    '<p>Your answers are saved on this device. <b>Bring this device to school</b> and show this screen to your teacher.</p>' +
    '<p class="small">Turned in ' + esc(fmt(state.finished)) + '. You only get one try, so this story is finished.</p>' +
    '<div class="teach noprint"><button class="tlink" id="tShow" type="button">Teacher</button>' +
    '<div class="tbox" id="tBox" hidden><input id="tCode" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="Teacher code">' +
    '<button class="btn primary" id="tGo" type="button">Show score</button></div><div class="err" id="tErr"></div></div></div>';
}

function grade(){
  var right = 0, total = 0;
  allQs().forEach(function(q){ if (q.type === 'mc') { total++; if (state.answers[q.id] === TEACHER.mc[q.id]) right++; } });
  return {right: right, total: total};
}
function reportHTML(){
  var g = grade(), pct = g.total ? Math.round(g.right / g.total * 100) : 0;
  var mins = state.started && state.finished ? Math.max(1, Math.round((new Date(state.finished) - new Date(state.started)) / 60000)) : '';
  var h = '<div class="report"><h2>' + esc(state.name) + '</h2><div class="small">' + (state.klass ? esc(state.klass) + '  •  ' : '') +
    esc(BOOK.title) + ', Grade ' + BOOK.grade + '  •  Turned in ' + esc(fmt(state.finished)) + (mins ? '  •  ' + mins + ' min' : '') + '</div>' +
    '<div class="sum"><div>Multiple choice<b>' + g.right + ' / ' + g.total + '</b></div><div>Percent<b>' + pct + '%</b></div>' +
    '<div>Written answers<b>' + allQs().filter(function(q){ return q.type === 'fr'; }).length + '</b>to read below</div></div>';
  labels().forEach(function(x){
    var q = x.q, a = state.answers[q.id];
    if (q.type === 'mc') {
      var ok = a === TEACHER.mc[q.id];
      h += '<div class="ri ' + (ok ? 'right' : 'wrong') + '"><div class="lab">' + x.label + '</div><div>' + esc(q.q) + '</div>' +
        '<div class="ans"><span class="mark">' + (ok ? '&#10004; ' : '&#10008; ') + '</span>' + (typeof a === 'number' ? esc('ABCD'[a] + '. ' + q.options[a]) : '(no answer)') + '</div>' +

        '<div class="ans"><b>Student:</b> ' + esc(a || '(no answer)') + '</div>' +
        '<div class="key"><b>Sample answer:</b> ' + esc(TEACHER.sample[q.id] || '') + '</div></div>';
    }
  });
  return h + '<div class="tbox noprint" style="justify-content:flex-start;margin-top:16px">' +
    '<button class="btn primary" id="tHide" type="button">Hide score</button>' +
    '<button class="btn ghost" id="tReset" type="button">' + (RESET_ARMED ? 'Press again to erase and let the student retake' : 'Let this student retake') + '</button></div></div>';
}
function bindDone(){
  var show = document.getElementById('tShow');
  if (show) {
    var box = document.getElementById('tBox'), inp = document.getElementById('tCode'), err = document.getElementById('tErr');
    show.onclick = function(){ box.hidden = !box.hidden; if (!box.hidden) inp.focus(); };
    var tryIt = function(){
      var k = unlock(inp.value);
      if (!k) { err.textContent = 'That code is not right.'; inp.value = ''; return; }
      TEACHER = k; RESET_ARMED = false; render();
    };
    document.getElementById('tGo').onclick = tryIt;
    inp.onkeydown = function(e){ if (e.key === 'Enter') tryIt(); };
  }
  var hide = document.getElementById('tHide');
  if (hide) hide.onclick = function(){ TEACHER = null; RESET_ARMED = false; render(); };
  var reset = document.getElementById('tReset');
  if (reset) reset.onclick = function(){
    if (!RESET_ARMED) { RESET_ARMED = true; render(); return; }
    TEACHER = null; RESET_ARMED = false; state = fresh(); save(); render();
  };
}

function bindPage(){
  Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-q');
      state.answers[id] = +b.getAttribute('data-i'); save();
      Array.prototype.forEach.call(app.querySelectorAll('.opt[data-q="' + id + '"]'), function(o){ o.classList.toggle('sel', o === b); });
      updateNav(); refreshTop();
    };
  });
  Array.prototype.forEach.call(app.querySelectorAll('textarea'), function(t){
    var id = t.getAttribute('data-q');
    var c = app.querySelector('[data-c="' + id + '"]');
    var upd = function(){ var n = words(t.value); c.textContent = n < MIN_WORDS ? 'Write at least ' + MIN_WORDS + ' words (' + n + ' so far)' : n + ' words ✔'; };
    t.oninput = function(){ state.answers[id] = t.value; save(); upd(); updateNav(); refreshTop(); };
    upd();
  });
  Array.prototype.forEach.call(app.querySelectorAll('.vw'), function(b){
    b.onclick = function(e){ e.stopPropagation(); showTip(b); };
  });
  var l = document.getElementById('listen');
  if (l) l.onclick = function(){
    if (!('speechSynthesis' in window)) return;
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); l.innerHTML = '&#128264; Listen'; return; }
    var u = new SpeechSynthesisUtterance(BOOK.pages[state.step - 1].text.replace(/\n\n/g, ' '));
    u.rate = BOOK.grade === 3 ? 0.85 : 0.95; u.onend = function(){ l.innerHTML = '&#128264; Listen'; };
    speechSynthesis.speak(u); l.innerHTML = '&#9632; Stop';

}

  hideTip();
  var w = b.getAttribute('data-w');
  tip = document.createElement('div'); tip.className = 'tip';
  tip.innerHTML = '<b>' + esc(w) + '</b>: ' + esc(BOOK.vocab[w]);
  document.body.appendChild(tip);
  var r = b.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, r.left)) + 'px';
  tip.style.top = (r.bottom + 8 + tip.offsetHeight > window.innerHeight ? r.top - tip.offsetHeight - 8 : r.bottom + 8) + 'px';
}
function hideTip(){ if (tip) { tip.remove(); tip = null; } }
document.addEventListener('click', hideTip);
window.addEventListener('scroll', hideTip);

function updateNav(){
  var s = state.step, next = document.getElementById('next'), need = document.getElementById('need');
  document.getElementById('back').disabled = s <= 1;
  if (s <= N + 1) {
    var ok = qsFor(s).every(answered);
    next.disabled = !ok;
    next.innerHTML = s < N ? 'Next page &#8594;' : (s === N ? 'Final questions &#8594;' : 'Review &#8594;');
    need.textContent = ok ? '' : 'Answer all the questions on this page to keep going.';
  } else {
    next.disabled = !allQs().every(answered);
    next.innerHTML = 'Turn In &#10004;';
    need.textContent = '';
  }
}

document.getElementById('back').onclick = function(){ if (state.step > 1 && !state.submitted) { state.step--; save(); render(-1); } };
document.getElementById('next').onclick = function(){
  var s = state.step;
  if (state.submitted) return;
  if (s <= N + 1) { if (!qsFor(s).every(answered)) return; state.step++; save(); render(1); return; }
  if (!allQs().every(answered)) return;
  state.submitted = true; state.finished = new Date().toISOString(); state.step = N + 3; save(); render(1);
};
document.addEventListener('keydown', function(e){
  if (/TEXTAREA|INPUT/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight' && !document.getElementById('next').disabled && state.step > 0 && state.step <= N + 1) document.getElementById('next').click();
  if (e.key === 'ArrowLeft' && state.step > 1 && state.step <= N + 2) document.getElementById('back').click();
});
// If the story is open in two tabs, keep them in step so a turned-in story stays locked.
window.addEventListener('storage', function(e){ if (e.key === KEY) { state = load() || fresh(); render(); } });

render();
</script>
