<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--main:#16406b;--accent:#3d8fc6;--soft:#eef4fa;--card:#fff;--vocab:#c2412d;--ink:#1c2733;--tint:#dce8f4;--ok:#1f7a3a;--warn:#b5651d}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--soft);color:var(--ink);font-family:Poppins,Arial,sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--main);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px}
.top h1{font-family:Fredoka,Poppins,sans-serif;font-size:20px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:13px;opacity:.9}
.bar{height:6px;background:rgba(255,255,255,.25)}
.bar>div{height:100%;background:var(--accent);transition:width .4s}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 110px}
.book{perspective:1600px}
.page{background:var(--card);border-radius:18px;box-shadow:0 6px 0 var(--tint),0 10px 30px rgba(0,0,0,.08);padding:22px;transform-origin:left center}
.flip-next{animation:flipNext .45s ease}
.flip-prev{animation:flipPrev .45s ease}
@keyframes flipNext{from{transform:rotateY(-70deg);opacity:.2}to{transform:rotateY(0);opacity:1}}
@keyframes flipPrev{from{transform:rotateY(70deg);opacity:.2}to{transform:rotateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.flip-next,.flip-prev{animation:none}}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.chip{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.pnum{font-family:Fredoka,sans-serif;color:var(--main);font-weight:600;font-size:15px;margin-left:8px}
.art{border-radius:14px;overflow:hidden;border:3px solid var(--main);margin:12px 0 14px;line-height:0}
.art{background:var(--tint)}.art svg{width:100%;height:auto;max-height:38vh;display:block}
.story p{margin:0 0 .85em}
.g3 .story{font-size:21px;line-height:1.65}
.g4 .story{font-size:18px;line-height:1.65}
.vw{color:var(--vocab);font-weight:700;background:none;border:none;padding:0;font-size:inherit;border-bottom:2px dotted var(--vocab)}
.tip{position:fixed;z-index:20;max-width:300px;background:#fff;border:2px solid var(--vocab);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.tip b{color:var(--vocab)}
.listen{background:var(--tint);border:none;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--main);margin-left:8px}
.qpanel{background:var(--soft);border:2px dashed var(--accent);border-radius:16px;padding:16px 18px}
.qpanel h2{font-family:Fredoka,sans-serif;font-size:19px;color:var(--main);margin:0 0 8px}
.q{margin:14px 0 18px}
.q .qt{font-weight:600;margin-bottom:8px}
.g3 .q .qt{font-size:18px}.g4 .q .qt{font-size:16.5px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:2px solid var(--tint);border-radius:12px;padding:11px 14px;margin:7px 0;font-size:16px;color:var(--ink);min-height:48px}
.g3 .opt{font-size:17px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--main);font-weight:700;display:grid;place-items:center}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--main);background:var(--tint)}
.opt.sel .l{background:var(--main);color:#fff}
textarea{width:100%;min-height:110px;border:2px solid var(--tint);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--ink);resize:vertical;background:#fff}
textarea:focus,input:focus{outline:3px solid var(--accent);outline-offset:1px}
.count{font-size:12px;color:#777;text-align:right}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--tint);display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;z-index:6}
.btn{border:none;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:600;min-height:50px}
.btn.primary{background:var(--main);color:#fff}
.btn.ghost{background:var(--tint);color:var(--main)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav[hidden]{display:none}
.need{font-size:14px;color:var(--warn);text-align:center;flex:1}
.start{max-width:640px;margin:0 auto;text-align:center}
.start h2{font-family:Fredoka,sans-serif;font-size:34px;color:var(--main);margin:8px 0 2px}
.start .sub{color:var(--accent);font-weight:600;margin-bottom:14px}
.field{text-align:left;margin:14px 0}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;font-size:18px;padding:12px;border:2px solid var(--tint);border-radius:12px;font-family:inherit}
.how{text-align:left;background:var(--soft);border-radius:14px;padding:12px 16px;font-size:15px;margin:14px 0}
.how li{margin:4px 0}
.review li{margin:6px 0}
.done{text-align:center;max-width:620px;margin:0 auto}
.done h2{font-family:Fredoka,sans-serif;color:var(--main);font-size:32px;margin:8px 0}
.score{font-family:Fredoka,sans-serif;font-size:54px;color:var(--ok);margin:6px 0}
.err{color:#b00020;font-weight:600}
.small{font-size:13px;color:#666}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots span{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots span.on{background:#fff}
.dots span.doneq{background:var(--accent)}
.teach{margin-top:26px;border-top:2px dashed var(--tint);padding-top:12px}
.tlink{background:none;border:none;color:#8a96a3;font-size:13px;text-decoration:underline}
.tbox{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px;flex-wrap:wrap}
.tbox input{font-size:20px;width:120px;padding:8px;border:2px solid var(--tint);border-radius:10px;text-align:center;letter-spacing:.2em;font-family:inherit}
.report{text-align:left;max-width:900px;margin:0 auto}
.report h2{font-family:Fredoka,sans-serif;color:var(--main);margin:4px 0}
.sum{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.sum div{background:var(--soft);border-radius:12px;padding:10px 14px;flex:1;min-width:130px}
.sum b{display:block;font-family:Fredoka,sans-serif;font-size:28px;color:var(--main)}
.ri{border:2px solid var(--tint);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.ri.right{border-color:#9fd3ad;background:#f1faf3}.ri.wrong{border-color:#efb1a8;background:#fdf3f1}
.ri .lab{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase}
.ri .ans{margin-top:4px}.ri .key{margin-top:4px;color:#555;font-size:14px}
.ri .mark{font-weight:700}.ri.right .mark{color:var(--ok)}.ri.wrong .mark{color:#b00020}
@media print{.nav,.top,.noprint{display:none!important}.page{box-shadow:none}}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.wcard{background:#fff;border:2px solid var(--tint);border-radius:14px;padding:12px 14px;font-size:15px}
.wtop{display:flex;align-items:center;justify-content:space-between}
.wword{font-family:Fredoka,sans-serif;font-size:26px;color:var(--vocab);font-weight:600}
.wsyl{color:var(--main);font-weight:600;margin:2px 0 6px}
.wex{margin-top:6px;color:#555;font-size:14px}
.sp .qt{display:flex;align-items:center;gap:6px}.sp .listen{margin-left:0;font-size:15px;padding:8px 16px}
.spin{width:100%;max-width:360px;font-size:22px;padding:10px 12px;border:2px solid var(--tint);border-radius:12px;font-family:inherit;margin-top:6px}
.report h3{font-family:Fredoka,sans-serif;color:var(--main);margin:18px 0 4px}
</style>
</head>
<body>
<div class="top"><h1 id="ttl"></h1><div class="dots" id="dots"></div><div class="who" id="who"></div></div>
<div class="bar"><div id="prog" style="width:0"></div></div>
<main class="wrap" id="app"></main>
<nav class="nav" id="nav" hidden>
  <button class="btn ghost" id="back">&#8592; Back</button>
  <div class="need" id="need"></div>
  <button class="btn primary" id="next">Next page &#8594;</button>
</nav>
<script>
/* Vocabulary practice: study the words, spell them, match the meanings, write sentences.
   No sign-in; answers stay on this device. No score for the student. The teacher types the
   teacher code on the finished screen to see the score. The answer key is locked with that code. */
var W = {"grade": 4, "week": 14, "title": "Week 14 Word Practice", "subtitle": "Spelling, meanings and sentences", "theme": {"main": "#16406b", "accent": "#3d8fc6", "soft": "#eef4fa", "card": "#ffffff", "vocab": "#c2412d", "ink": "#1c2733", "tint": "#dce8f4"}, "words": {"timid": {"forms": ["timid"], "syl": "tim \u2022 id", "pos": "adjective", "meaning": "Someone who is timid is shy and may lack courage or confidence.", "clue": "Shy; may lack courage or confidence (adjective)", "example": "None of them were timid.", "blank": "None of them were ______.", "say": "timid. None of them were timid.. timid."}, "strenuous": {"forms": ["strenuous"], "syl": "stren \u2022 u \u2022 ous", "pos": "adjective", "meaning": "If an activity is strenuous, it takes great effort or a lot of energy.", "clue": "Taking great effort or a lot of energy (adjective)", "example": "The work was strenuous.", "blank": "The work was ______.", "say": "strenuous. The work was strenuous.. strenuous."}, "devised": {"forms": ["devised", "devise"], "syl": "de \u2022 vised", "pos": "verb", "meaning": "If you devised a plan, you figured out a way to achieve that plan.", "clue": "Figured out a way to carry out a plan (verb)", "example": "Shackleton devised a plan that no one had ever tried.", "blank": "Shackleton ______ a plan that no one had ever tried.", "say": "devised. Shackleton devised a plan that no one had ever tried.. devised."}, "distress": {"forms": ["distress"], "syl": "dis \u2022 tress", "pos": "noun", "meaning": "If you are in distress, you are very worried and upset.", "clue": "A feeling of being very worried and upset (noun)", "example": "If the men fell into distress, they might stop working together.", "blank": "If the men fell into ______, they might stop working together.", "say": "distress. If the men fell into distress, they might stop working together.. distress."}, "odyssey": {"forms": ["odyssey"], "syl": "od \u2022 ys \u2022 sey", "pos": "noun", "meaning": "An odyssey is a long journey that is exciting and eventful.", "clue": "A long, exciting, eventful journey (noun)", "example": "It was the most dangerous part of their odyssey so far.", "blank": "It was the most dangerous part of their ______ so far.", "say": "odyssey. It was the most dangerous part of their odyssey so far.. odyssey."}, "destiny": {"forms": ["destiny"], "syl": "des \u2022 ti \u2022 ny", "pos": "noun", "meaning": "A person's destiny is what will eventually happen in his or her life.", "clue": "What will eventually happen in a person's life (noun)", "example": "They knew that their destiny depended on staying strong together.", "blank": "They knew that their ______ depended on staying strong together.", "say": "destiny. They knew that their destiny depended on staying strong together.. destiny."}, "mortal": {"forms": ["mortals", "mortal"], "syl": "mor \u2022 tal", "pos": "noun", "meaning": "A mortal is a person who lives and dies.", "clue": "A person who lives and dies (noun)", "example": "Any mortal who fell into that icy water would not survive for long.", "blank": "Any ______ who fell into that icy water would not survive for long.", "say": "mortal. Any mortal who fell into that icy water would not survive for long.. mortal."}}, "order": ["timid", "mortal", "destiny", "strenuous", "odyssey", "devised", "distress"], "mcq": [{"id": "m0", "word": "destiny", "options": ["A feeling of being very worried and upset", "What will eventually happen in a person's life", "A person who lives and dies", "Taking great effort or a lot of energy"]}, {"id": "m1", "word": "odyssey", "options": ["A person who lives and dies", "A feeling of being very worried and upset", "What will eventually happen in a person's life", "A long, exciting, eventful journey"]}, {"id": "m2", "word": "timid", "options": ["Shy; may lack courage or confidence", "Taking great effort or a lot of energy", "Figured out a way to carry out a plan", "A feeling of being very worried and upset"]}, {"id": "m3", "word": "mortal", "options": ["A long, exciting, eventful journey", "A person who lives and dies", "Shy; may lack courage or confidence", "A feeling of being very worried and upset"]}, {"id": "m4", "word": "devised", "options": ["Taking great effort or a lot of energy", "A person who lives and dies", "Figured out a way to carry out a plan", "A feeling of being very worried and upset"]}, {"id": "m5", "word": "strenuous", "options": ["Taking great effort or a lot of energy", "Figured out a way to carry out a plan", "What will eventually happen in a person's life", "A person who lives and dies"]}, {"id": "m6", "word": "distress", "options": ["A long, exciting, eventful journey", "Figured out a way to carry out a plan", "A feeling of being very worried and upset", "What will eventually happen in a person's life"]}]};
var LOCK = '6umC3r7OlqL0pOEWtE7xGjqmhoLOs5NLDTFTamkFNOrc9IgPSl9JJkrwHN4BEIEmWYp9MkxI2lb1ncYSOcTHUFRGaPRJN1FIFeDPSdhTzdF45TeepDEvgcyitzMUjeIKU68N5jdxvt28RfsTFK+QvF80CgUjlf+vub5ToKw/4/DuV0uXIrjKjDxrpp8xMXc80E9bTHbISKbudTL6EKoxPsNS99saLJS36+KWKESmv7N39GRHu4eZBszK7B/WHjfZWVzqlVJM+MLfGbKwm0Kn5LPX5XztKt1P6KJnW7J4l4+QlIRZXeSVOKhbZSOLWQzDkI9aopzixlYgLYdM0V4=';
var MIN_WORDS = W.grade === 3 ? 5 : 7;
var KEY = 'wordpractice-' + W.grade + '-' + W.week;
function fresh(){ return {step: 0, name: '', klass: '', spell: {}, mc: {}, sent: {}, submitted: false, started: null, finished: null}; }
var state = load() || fresh();
var app = document.getElementById('app');
var STEPS = ['Start', 'Study', 'Spelling', 'Meanings', 'Sentences', 'Turn in', 'Done'];
var TEACHER = null, RESET_ARMED = false;

document.body.className = 'g' + W.grade;
var th = W.theme, rs = document.documentElement.style;
['main','accent','soft','card','vocab','ink','tint'].forEach(function(k){ rs.setProperty('--' + k, th[k]); });
document.title = W.title + ' - Grade ' + W.grade;
document.getElementById('ttl').textContent = W.title + '  •  Grade ' + W.grade;

function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function words(s){ return (s || '').trim().split(/\s+/).filter(Boolean).length; }
function fnv(str){ var b = unescape(encodeURIComponent(str)), h = 0x811c9dc5; for (var i = 0; i < b.length; i++) { h ^= b.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function stream(seed){ var a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) & 255; }; }
function unlock(code){
  try {
    var raw = atob(LOCK), next = stream(fnv(String(code).trim() + '|' + W.title)), out = '';
    for (var i = 0; i < raw.length; i++) out += String.fromCharCode(raw.charCodeAt(i) ^ next());
    var k = JSON.parse(decodeURIComponent(escape(out)));
    return k && k.ok === 'storykey' ? k : null;
  } catch(e){ return null; }
}
function speak(text, btn){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text); u.rate = W.grade === 3 ? 0.8 : 0.9;
  speechSynthesis.speak(u);
}
// The sentence must use the word (any of its listed forms, or the word plus s / es / ed / ing / ly).
function usesWord(w, s){
  var forms = W.words[w].forms.concat([w]);
  var t = (s || '').toLowerCase();
  return forms.some(function(f){ return new RegExp('\\b' + f.toLowerCase() + '(s|es|ed|d|ing|ly)?\\b').test(t); });
}
function list(){ return W.order; }
function stepDone(s){
  if (s === 2) return list().every(function(w){ return (state.spell[w] || '').trim().length > 0; });
  if (s === 3) return W.mcq.every(function(q){ return typeof state.mc[q.id] === 'number'; });
  if (s === 4) return list().every(function(w){ return usesWord(w, state.sent[w]) && words(state.sent[w]) >= MIN_WORDS; });
  return true;
}
function canBack(s){ return s === 4 || s === 5; }   // no going back into Study or Spelling once spelling starts

function render(dir){
  if (state.submitted) state.step = 6;
  var s = state.step, nav = document.getElementById('nav');
  document.getElementById('who').textContent = state.name || '';
  document.getElementById('prog').style.width = (s / 6 * 100) + '%';
  var dots = '';
  for (var i = 1; i <= 5; i++) dots += '<span class="' + (i === s ? 'on' : (i < s ? 'doneq' : '')) + '"></span>';
  document.getElementById('dots').innerHTML = s === 0 || s === 6 ? '' : dots;
  var cls = 'page' + (dir ? (dir > 0 ? ' flip-next' : ' flip-prev') : '');
  if (s === 0) { nav.hidden = true; app.innerHTML = startHTML(); bindStart(); return; }
  if (s === 6) { nav.hidden = true; app.innerHTML = '<div class="book"><div class="' + cls + '">' + (TEACHER ? reportHTML() : doneHTML()) + '</div></div>'; bindDone(); window.scrollTo(0, 0); return; }
  nav.hidden = false;
  var body = [null, studyHTML, spellHTML, mcHTML, sentHTML, reviewHTML][s]();
  app.innerHTML = '<div class="book"><div class="' + cls + '">' + body + '</div></div>';
  bindPage(); updateNav(); window.scrollTo(0, 0);
}

function startHTML(){
  return '<div class="page start"><h2>' + esc(W.title) + '</h2><div class="sub">' + esc(W.subtitle) + '  •  Grade ' + W.grade + '</div>' +
    (state.name ? '<p>Welcome back, <b>' + esc(state.name) + '</b>!</p>' :
    '<div class="field"><label for="nm">Your first and last name</label><input id="nm" autocomplete="off" maxlength="60"></div>' +
    '<div class="field"><label for="kl">Your class or teacher (optional)</label><input id="kl" autocomplete="off" maxlength="40"></div>') +
    '<ul class="how"><li><b>Part 1, Study:</b> learn the ' + list().length + ' words.</li>' +
    '<li><b>Part 2, Spelling:</b> listen to each word and type it. You cannot look back at the words during spelling!</li>' +
    '<li><b>Part 3, Meanings:</b> choose what each word means.</li>' +
    '<li><b>Part 4, Sentences:</b> write your own sentence for each word.</li>' +
    '<li>You only get <b>one try</b>. After you turn it in, you cannot change your answers.</li></ul>' +
    '<div class="err" id="serr"></div><button class="btn primary" id="go">' + (state.started ? 'Keep going' : 'Start') + ' &#8594;</button></div>';
}
function bindStart(){
  document.getElementById('go').onclick = function(){
    if (!state.name) {
      var nm = document.getElementById('nm').value.trim().replace(/\s+/g, ' ');
      if (nm.split(' ').length < 2 || nm.length < 4) { document.getElementById('serr').textContent = 'Please type your first and last name.'; return; }
      state.name = nm; state.klass = document.getElementById('kl').value.trim();
    }
    state.started = state.started || new Date().toISOString();
    if (!state.step) state.step = 1;
    save(); render(1);
  };
}

function studyHTML(){
  return '<div class="qpanel" style="max-width:900px;margin:0 auto"><h2>Part 1: Study the Words</h2>' +
    '<div class="small">Read each word, its parts, and what it means. Press &#128264; to hear it. Study carefully: in Part 2 you will spell these words without looking!</div>' +
    '<div class="cards">' + list().map(function(w){ var d = W.words[w];
      return '<div class="wcard"><div class="wtop"><span class="wword">' + esc(w) + '</span><button class="listen" type="button" data-say="' + esc(w) + '">&#128264;</button></div>' +
        '<div class="wsyl">' + esc(d.syl) + '  <i>(' + esc(d.pos) + ')</i></div><div>' + esc(d.meaning) + '</div>' +
        '<div class="wex">&#8220;' + esc(d.example) + '&#8221;</div></div>'; }).join('') + '</div></div>';
}
function spellHTML(){
  var n = 0;
  return '<div class="qpanel" style="max-width:820px;margin:0 auto"><h2>Part 2: Spelling</h2>' +
    '<div class="small">Press <b>&#128264; Hear it</b>. Listen to the word and the sentence, then type the word. Use the clue if you need help.</div>' +
    list().map(function(w){ var d = W.words[w]; n++;
      return '<div class="q sp"><div class="qt">' + n + '. <button class="listen" type="button" data-say="' + esc(d.say) + '">&#128264; Hear it</button></div>' +
        '<div class="small">Clue: ' + esc(d.clue) + '</div><div class="small">Sentence: ' + esc(d.blank) + '</div>' +
        '<input class="spin" data-w="' + esc(w) + '" value="' + esc(state.spell[w] || '') + '" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Spelling word ' + n + '"></div>';
    }).join('') + '</div>';
}
function mcHTML(){
  var n = 0;
  return '<div class="qpanel" style="max-width:820px;margin:0 auto"><h2>Part 3: Meanings</h2><div class="small">Choose what each word means.</div>' +
    W.mcq.map(function(q){ n++; var a = state.mc[q.id];
      return '<div class="q"><div class="qt">' + n + '. What does <b style="color:var(--vocab)">' + esc(q.word) + '</b> mean?</div>' +
        q.options.map(function(o, i){ return '<button type="button" class="opt' + (a === i ? ' sel' : '') + '" data-q="' + q.id + '" data-i="' + i + '"><span class="l">' + 'ABCD'[i] + '</span><span>' + esc(o) + '</span></button>'; }).join('') + '</div>';
    }).join('') + '</div>';
}
function sentHTML(){
  var n = 0;
  return '<div class="qpanel" style="max-width:820px;margin:0 auto"><h2>Part 4: Use the Words</h2>' +
    '<div class="small">Write your own sentence for each word. Use the word, spell it correctly, and write at least ' + MIN_WORDS + ' words. Show what the word means!</div>' +
    list().map(function(w){ var d = W.words[w]; n++;
      return '<div class="q"><div class="qt">' + n + '. <span style="color:var(--vocab)">' + esc(w) + '</span> <span class="small">(' + esc(d.clue) + ')</span></div>' +
        '<textarea data-w="' + esc(w) + '" style="min-height:70px" placeholder="Write a sentence using ' + esc(w) + '...">' + esc(state.sent[w] || '') + '</textarea><div class="count" data-c="' + esc(w) + '"></div></div>';
    }).join('') + '</div>';
}
function reviewHTML(){
  var miss = [];
  if (!stepDone(4)) miss.push('Finish every sentence in Part 4.');
  return '<div class="start"><h2>Ready to turn in?</h2><p>Name: <b>' + esc(state.name) + '</b>' + (state.klass ? '  •  Class: <b>' + esc(state.klass) + '</b>' : '') + '</p>' +
    (miss.length ? '<p class="err">' + miss.join(' ') + '</p>' : '<p>You finished all four parts. You can press <b>Back</b> to check your meanings and sentences.</p><p><b>Remember:</b> you only get one try. After you press <b>Turn In</b>, you cannot change your answers.</p>') + '</div>';
}
function fmt(d){ try { return new Date(d).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}); } catch(e){ return ''; } }
function doneHTML(){
  return '<div class="done"><h2>Turned in! Great job, ' + esc(state.name.split(' ')[0]) + '!</h2>' +
    '<p>Your answers are saved on this device. <b>Bring this device to school</b> and show this screen to your teacher.</p>' +
    '<p class="small">Turned in ' + esc(fmt(state.finished)) + '. You only get one try, so this practice is finished.</p>' +
    '<div class="teach noprint"><button class="tlink" id="tShow" type="button">Teacher</button>' +
    '<div class="tbox" id="tBox" hidden><input id="tCode" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="Teacher code">' +
    '<button class="btn primary" id="tGo" type="button">Show score</button></div><div class="err" id="tErr"></div></div></div>';
}
function norm(s){ return String(s || '').trim().toLowerCase(); }
function reportHTML(){
  var sp = 0, mc = 0, us = 0;
  list().forEach(function(w){ if (norm(state.spell[w]) === norm(TEACHER.spell[w])) sp++; if (usesWord(w, state.sent[w])) us++; });
  W.mcq.forEach(function(q){ if (state.mc[q.id] === TEACHER.mc[q.id]) mc++; });
  var n = list().length, tot = sp + mc, pct = Math.round(tot / (2 * n) * 100);
  var mins = state.started && state.finished ? Math.max(1, Math.round((new Date(state.finished) - new Date(state.started)) / 60000)) : '';
  var h = '<div class="report"><h2>' + esc(state.name) + '</h2><div class="small">' + (state.klass ? esc(state.klass) + '  •  ' : '') +
    esc(W.title) + ', Grade ' + W.grade + '  •  Turned in ' + esc(fmt(state.finished)) + (mins ? '  •  ' + mins + ' min' : '') + '</div>' +
    '<div class="sum"><div>Spelling<b>' + sp + ' / ' + n + '</b></div><div>Meanings<b>' + mc + ' / ' + n + '</b></div>' +
    '<div>Total<b>' + tot + ' / ' + (2 * n) + '</b>' + pct + '%</div><div>Sentences<b>' + n + '</b>to read below</div></div>';
  h += '<h3>Part 2: Spelling</h3>';
  list().forEach(function(w, i){ var ok = norm(state.spell[w]) === norm(TEACHER.spell[w]);
    h += '<div class="ri ' + (ok ? 'right' : 'wrong') + '"><span class="mark">' + (ok ? '&#10004; ' : '&#10008; ') + '</span>' + (i + 1) + '. Typed: <b>' + esc(state.spell[w] || '(blank)') + '</b>' +
      (ok ? '' : '<span class="key">  &nbsp; Correct: ' + esc(TEACHER.spell[w]) + '</span>') + '</div>'; });
  h += '<h3>Part 3: Meanings</h3>';
  W.mcq.forEach(function(q, i){ var a = state.mc[q.id], ok = a === TEACHER.mc[q.id];
    h += '<div class="ri ' + (ok ? 'right' : 'wrong') + '"><b>' + esc(q.word) + '</b>: <span class="mark">' + (ok ? '&#10004; ' : '&#10008; ') + '</span>' + (typeof a === 'number' ? esc(q.options[a]) : '(no answer)') +
      (ok ? '' : '<div class="key">Correct: ' + esc(q.options[TEACHER.mc[q.id]]) + '</div>') + '</div>'; });
  h += '<h3>Part 4: Sentences</h3><div class="small">Read each one: does the sentence show what the word means?</div>';
  list().forEach(function(w){
    h += '<div class="ri"><div class="lab">' + esc(w) + '</div><div class="ans">' + esc(state.sent[w] || '(no answer)') + '</div></div>'; });
  return h + '<div class="tbox noprint" style="justify-content:flex-start;margin-top:16px">' +
    '<button class="btn primary" id="tHide" type="button">Hide score</button>' +
    '<button class="btn ghost" id="tReset" type="button">' + (RESET_ARMED ? 'Press again to erase and let the student retake' : 'Let this student retake') + '</button></div></div>';
}
function bindDone(){
  var show = document.getElementById('tShow');
  if (show) {
    var box = document.getElementById('tBox'), inp = document.getElementById('tCode'), err = document.getElementById('tErr');
    show.onclick = function(){ box.hidden = !box.hidden; if (!box.hidden) inp.focus(); };
    var tryIt = function(){ var k = unlock(inp.value); if (!k) { err.textContent = 'That code is not right.'; inp.value = ''; return; } TEACHER = k; RESET_ARMED = false; render(); };
    document.getElementById('tGo').onclick = tryIt;
    inp.onkeydown = function(e){ if (e.key === 'Enter') tryIt(); };
  }
  var hide = document.getElementById('tHide');
  if (hide) hide.onclick = function(){ TEACHER = null; RESET_ARMED = false; render(); };
  var reset = document.getElementById('tReset');
  if (reset) reset.onclick = function(){ if (!RESET_ARMED) { RESET_ARMED = true; render(); return; } TEACHER = null; RESET_ARMED = false; state = fresh(); save(); render(); };
}

function bindPage(){
  Array.prototype.forEach.call(app.querySelectorAll('[data-say]'), function(b){ b.onclick = function(){ speak(b.getAttribute('data-say')); }; });
  Array.prototype.forEach.call(app.querySelectorAll('.spin'), function(t){
    t.oninput = function(){ state.spell[t.getAttribute('data-w')] = t.value; save(); updateNav(); };
    t.onpaste = function(e){ e.preventDefault(); };
  });
  Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-q'); state.mc[id] = +b.getAttribute('data-i'); save();
      Array.prototype.forEach.call(app.querySelectorAll('.opt[data-q="' + id + '"]'), function(o){ o.classList.toggle('sel', o === b); });
      updateNav();
    };
  });
  Array.prototype.forEach.call(app.querySelectorAll('textarea'), function(t){
    var w = t.getAttribute('data-w'), c = app.querySelector('[data-c="' + w + '"]');
    var upd = function(){ var n = words(t.value);
      c.textContent = !usesWord(w, t.value) ? (n ? 'Use the word "' + w + '" in your sentence (check the spelling).' : '') : (n < MIN_WORDS ? 'Write at least ' + MIN_WORDS + ' words (' + n + ' so far)' : 'Looks good ✔'); };
    t.oninput = function(){ state.sent[w] = t.value; save(); upd(); updateNav(); };
    upd();
  });
}
function updateNav(){
  var s = state.step, next = document.getElementById('next'), need = document.getElementById('need');
  document.getElementById('back').disabled = !canBack(s);
  var ok = stepDone(s);
  if (s < 5) {
    next.disabled = !ok;
    next.innerHTML = s === 1 ? 'Start spelling &#8594;' : s === 4 ? 'Review &#8594;' : 'Next part &#8594;';
    need.textContent = ok ? (s === 1 ? 'You cannot come back to this page during spelling.' : s === 2 ? 'After this part, you cannot change your spelling.' : '') : 'Answer everything on this page to keep going.';
  } else {
    next.disabled = !stepDone(4); next.innerHTML = 'Turn In &#10004;'; need.textContent = '';
  }
}
document.getElementById('back').onclick = function(){ if (canBack(state.step) && !state.submitted) { state.step--; save(); render(-1); } };
document.getElementById('next').onclick = function(){
  var s = state.step;
  if (state.submitted || !stepDone(s)) return;
  if (s < 5) { state.step++; save(); render(1); return; }
  if (!stepDone(2) || !stepDone(3) || !stepDone(4)) return;
  state.submitted = true; state.finished = new Date().toISOString(); state.step = 6; save(); render(1);
};
window.addEventListener('storage', function(e){ if (e.key === KEY) { state = load() || fresh(); render(); } });
render();
</script>
</body>
</html>
